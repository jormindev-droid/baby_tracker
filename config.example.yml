# 阿里云OSS配置
aliyun_oss:
  # 阿里云访问密钥
  access_key_id: "your-access-key-id"
  access_key_secret: "your-access-key-secret"
  
  # OSS配置
  endpoint: "oss-cn-hangzhou.aliyuncs.com"  # 根据您的区域修改
  bucket_name: "your-bucket-name"
  region: "cn-hangzhou"  # 根据您的区域修改
  
  # 存储路径配置
  upload_prefix: "baby_tracker/"  # 上传文件的前缀路径
  thumbnail_suffix: "_thumbnail"  # 缩略图后缀
  
  # 缩略图配置
  thumbnail_width: 300  # 缩略图宽度
  thumbnail_height: 300  # 缩略图高度
  thumbnail_quality: 80  # 缩略图质量 (0-100)
  
  # 安全配置
  expire_time: 3600  # 签名过期时间（秒）
  max_size: 10485760  # 最大文件大小（10MB）

# 应用配置
app:
  debug: false
  secret_key: "your-secret-key-here"
  
# 数据库配置
database:
  uri: "sqlite:///baby_tracker.db"
  
# 上传配置
upload:
  allowed_extensions: [".jpg", ".jpeg", ".png", ".gif", ".bmp"]
  max_file_size: 10485760  # 10MB